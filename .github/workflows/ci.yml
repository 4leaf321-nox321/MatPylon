# typecheck · test · 설치파일 빌드. 태그(v*) 를 밀면 릴리스에 설치파일을 올린다.
# 빌드는 Windows 에서만 — 타깃이 Windows 뿐이고 better-sqlite3 는 그 ABI 로 리빌드된다.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# 릴리스를 만들려면 쓰기 권한이 필요하다. 기본 토큰은 읽기 전용이라
# "Resource not accessible by integration" 으로 막혔다(v0.1.0 첫 시도).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      # Electron 115MB 와 NSIS 를 매번 GitHub 릴리스에서 받는다. 한 번은 다운로드 중
      # 연결이 끊겨 빌드가 죽었다(2026-08-28). 받은 것을 캐시에 두면 그 구간이 사라진다.
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: MatPylon-Setup
          path: release/MatPylon-Setup-*.exe
          if-no-files-found: error
      - name: 릴리스
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/MatPylon-Setup-*.exe
          generate_release_notes: true
