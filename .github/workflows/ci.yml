# typecheck · test · 설치파일 빌드. 태그(v*) 를 밀면 릴리스에 설치파일을 올린다.
# 빌드는 Windows 에서만 — 타깃이 Windows 뿐이고 better-sqlite3 는 그 ABI 로 리빌드된다.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: MatPylon-Setup
          path: release/MatPylon-Setup-*.exe
          if-no-files-found: error
      - name: 릴리스
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/MatPylon-Setup-*.exe
          generate_release_notes: true
